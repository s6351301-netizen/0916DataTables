<!DOCTYPE html>
<html lang="en">

<head>
    <title>Bootstrap Example</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/3.0.4/css/dataTables.dataTables.css" />

</head>

<body>
    <table id="myTable" class="display">
        <thead>
            <tr>
                <th>id</th>
                <th>word</th>
                <th>meaning</th>
                <th>pronunciation</th>
                <th>sentence</th>
                <th>sentence_meaning</th>
            </tr>
        </thead>
        <tbody id="myTbody">
            <!-- <tr>
                <td>Row 1 Data 1</td>
                <td>Row 1 Data 2</td>
            </tr>
            <tr>
                <td>Row 2 Data 1</td>
                <td>Row 2 Data 2</td>
            </tr> -->
        </tbody>
    </table>


    <!-- jquery  -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
        integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <!-- 先載入 jquery 才能 載入 dataTables -->

    <!-- <img src="./data/data.json" alt=""> -->
    <script src="https://cdn.datatables.net/3.0.4/js/dataTables.js"></script>
    <script>

        $(document).ready(function () {

            // 0.data

            // let data = [
            //     {
            //         'id': 1,
            //         'name': 'amy'
            //     },
            //     {
            //         'id': 2,
            //         'name': 'bob'
            //     },
            //     {
            //         'id': 3,
            //         'name': 'cat'
            //     }
            // ];


            // 1.bind 
            const myTable = $('#myTable');
            const myTbody = $('#myTbody');
            // 2.action

            // dataTables 使用
            // 當資料量很小 可以使用dataTables 如果資料很大 建議還是後端語言分割
            // myTable.DataTable({

            // });



            // ajax

            let url = `./data/data.json`;
            $.ajax({
                type: "get",
                url: url,
                // data: "data",
                dataType: "json",
                success: function (res) {
                    console.log('res', res);
                    data = res;

                    let tmpText = ``;
                    $.each(data, function (key, value) {
                        tmpText += `
                        <tr>
                            <td>${value.id}</td>
                            <td>${value.word}</td>
                            <td>${value.meaning}</td>
                            <td>${value.pronunciation}</td>
                            <td>${value.sentence}</td>
                            <td>${value.sentence_meaning}</td>
                        </tr>
                        `;
                    });

                    myTbody.append(tmpText);
                    myTable.DataTable();

                }
            });

            // ajax end

        });



    </script>
</body>

</html>
