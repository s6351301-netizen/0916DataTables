<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataTables 英文單字查詢系統 - 雲端同步版</title>
    <!-- 引入 Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入 DataTables CSS -->
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <!-- 導覽列：包含登入狀態與按鈕 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">英文單字查詢系統</a>
            <div class="d-flex align-items-center gap-3">
                <span id="userInfo" class="text-light small">檢查登入狀態中...</span>
                <button id="loginBtn" class="btn btn-outline-light btn-sm" onclick="loginWithGoogle()" style="display: none;">
                    <i class="bi bi-google"></i> Google 登入同步
                </button>
                <button id="logoutBtn" class="btn btn-outline-danger btn-sm" onclick="logoutGoogle()" style="display: none;">
                    登出
                </button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow-sm p-4 bg-white">
            <h2 class="mb-3">單字清單與我的最愛</h2>
            <p class="text-muted">登入 Google 帳號後，您的「我的最愛」將自動備份至雲端，隨時隨地多裝置同步！</p>
            
            <!-- DataTables 表格 -->
            <table id="wordTable" class="table table-striped table-bordered" style="width:100%">
                <thead>
                    <tr>
                        <th>選擇</th>
                        <th>單字 (Word)</th>
                        <th>狀態</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- 範例資料，可動態生成 -->
                    <tr>
                        <td><input type="checkbox" class="fav-checkbox" data-word="able" onchange="toggleFavorite(this)"></td>
                        <td>able</td>
                        <td><span class="badge bg-secondary">一般</span></td>
                    </tr>
                    <tr>
                        <td><input type="checkbox" class="fav-checkbox" data-word="abacus" onchange="toggleFavorite(this)"></td>
                        <td>abacus</td>
                        <td><span class="badge bg-secondary">一般</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 引入 jQuery 與 DataTables JS -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

    <!-- Firebase 整合指令碼 (使用 ES Module) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ================= 1. 填入您的 Firebase 專案設定 =================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let localFavorites = JSON.parse(localStorage.getItem('my_favorites')) || [];

        // 初始化 DataTables
        $(document).ready(function() {
            $('#wordTable').DataTable({
                language: {
                    url: "https://cdn.datatables.net/plug-ins/1.13.6/i18n/zh-HANT.json"
                }
            });
            updateUIFromFavorites();
        });

        // ================= 2. Google 登入與登出功能 =================
        window.loginWithGoogle = function() {
            signInWithPopup(auth, provider)
                .then((result) => {
                    console.log("登入成功：", result.user.displayName);
                })
                .catch((error) => {
                    console.error("登入失敗", error);
                });
        };

        window.logoutGoogle = function() {
            signOut(auth).then(() => {
                alert("已成功登出");
            }).catch((error) => {
                console.error("登出失敗", error);
            });
        };

        // ================= 3. 監聽登入狀態並同步資料 =================
        onAuthStateChanged(auth, async (user) => {
            const loginBtn = document.getElementById("loginBtn");
            const logoutBtn = document.getElementById("logoutBtn");
            const userInfo = document.getElementById("userInfo");

            if (user) {
                // 已登入
                currentUser = user;
                userInfo.innerHTML = `<i class="bi bi-person-circle"></i> ${user.displayName} (${user.email})`;
                loginBtn.style.display = "none";
                logoutBtn.style.display = "inline-block";

                // 從 Firestore 讀取雲端資料
                await syncCloudToLocal(user.uid);
            } else {
                // 未登入
                currentUser = null;
                userInfo.innerText = "未登入 (使用本地儲存)";
                loginBtn.style.display = "inline-block";
                logoutBtn.style.display = "none";
            }
        });

        // ================= 4. 資料同步邏輯 =================
        // 從雲端下載資料合併至本地
        async function syncCloudToLocal(uid) {
            try {
                const docRef = doc(db, "users", uid);
                const docSnap = await getDoc(docRef);
                
                if (docSnap.exists()) {
                    const cloudData = docSnap.data();
                    // 如果雲端有資料，以雲端為主或進行合併
                    if (cloudData.favorites) {
                        localFavorites = cloudData.favorites;
                        localStorage.setItem('my_favorites', JSON.stringify(localFavorites));
                    }
                } else {
                    // 若雲端無資料，將目前的 LocalStorage 資料上傳初始化
                    await saveFavoritesToCloud(localFavorites);
                }
                updateUIFromFavorites();
                console.log("雲端資料同步完成！");
            } catch (e) {
                console.error("讀取雲端資料錯誤：", e);
            }
        }

        // 儲存至雲端 (Firestore)
        async function saveFavoritesToCloud(favoritesArray) {
            if (!currentUser) return;
            try {
                await setDoc(doc(db, "users", currentUser.uid), {
                    favorites: favoritesArray,
                    updatedAt: new Date().toISOString()
                }, { merge: true });
                console.log("已同步至雲端");
            } catch (e) {
                console.error("上傳雲端失敗：", e);
            }
        }

        // ================= 5. 操作介面狀態互動 =================
        window.toggleFavorite = function(checkbox) {
            const word = checkbox.getAttribute('data-word');
            if (checkbox.checked) {
                if (!localFavorites.includes(word)) localFavorites.push(word);
            } else {
                localFavorites = localFavorites.filter(item => item !== word);
            }

            // 儲存至本地端
            localStorage.setItem('my_favorites', JSON.stringify(localFavorites));

            // 若已登入，同步至雲端
            if (currentUser) {
                saveFavoritesToCloud(localFavorites);
            }
        };

        // 根據目前最愛清單更新畫面勾選狀態
        function updateUIFromFavorites() {
            document.querySelectorAll('.fav-checkbox').forEach(checkbox => {
                const word = checkbox.getAttribute('data-word');
                if (localFavorites.includes(word)) {
                    checkbox.checked = true;
                } else {
                    checkbox.checked = false;
                }
            });
        }
    </script>
</body>
</html>
