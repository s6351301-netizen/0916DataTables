<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全台各縣市未來天氣預報</title>
    
    <!-- 引入 DataTables 與響應式 CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.dataTables.min.css">
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif; background-color: #f4f6f9; margin: 0; padding: 10px; }
        .container { width: 100%; max-width: 100%; margin: 0 auto; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); box-sizing: border-box; }
        .header-box { display: flex; flex-direction: column; gap: 5px; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        h2 { color: #2c3e50; font-size: 20px; margin: 0; }
        p.subtitle { color: #7f8c8d; font-size: 12px; margin: 0; }
        .update-info { font-size: 12px; color: #383d41; background: #e2e3e5; padding: 6px 10px; border-radius: 4px; align-self: flex-start; font-weight: bold; }
        
        /* 溫度與降雨機率樣式微調 */
        .badge-temp { background-color: #e8f4fd; color: #0969da; padding: 3px 6px; border-radius: 4px; font-weight: bold; }
        .badge-rain { background-color: #fff8c5; color: #9a6700; padding: 3px 6px; border-radius: 4px; font-weight: bold; }

        /* 調整 DataTables 在手機上的排版 */
        table.dataTable { width: 100% !important; font-size: 14px; }
        .dataTables_wrapper .dataTables_filter input { padding: 5px; border: 1px solid #ccc; border-radius: 4px; width: 140px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-box">
            <h2>🌤️ 臺灣各縣市未來天氣預報</h2>
            <p class="subtitle">資料來源：中央氣象署公開開放資料</p>
            <div class="update-info">
                最後更新：<span id="lastUpdateTime">載入中...</span>
            </div>
        </div>
        
        <!-- 表格容器 -->
        <table id="weatherTable" class="display responsive nowrap" style="width:100%">
            <thead>
                <tr>
                    <th>縣市名稱</th>
                    <th>天氣現象 (Wx)</th>
                    <th>降雨機率 (PoP)</th>
                    <th>最低溫 (°C)</th>
                    <th>最高溫 (°C)</th>
                    <th>舒適度 (CI)</th>
                </tr>
            </thead>
            <tbody>
                <!-- 資料將透過 JavaScript 自動填入 -->
            </tbody>
        </table>
    </div>

    <!-- 引入 jQuery 與 DataTables JS 相關套件 -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>

    <script>
        $(document).ready(function() {
            let table;

            function getFormattedTime() {
                let now = new Date();
                let year = now.getFullYear();
                let month = String(now.getMonth() + 1).padStart(2, '0');
                let day = String(now.getDate()).padStart(2, '0');
                let hours = String(now.getHours()).padStart(2, '0');
                let minutes = String(now.getMinutes()).padStart(2, '0');
                let seconds = String(now.getSeconds()).padStart(2, '0');
                return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
            }

            // 初始化 DataTables
            table = $('#weatherTable').DataTable({
                responsive: true,
                pageLength: 22, // 剛好涵蓋全台各縣市
                language: {
                    "lengthMenu": "每頁 _MENU_ 筆",
                    "zeroRecords": "載入中或找不到符合資料",
                    "info": "顯示 _START_-_END_ / 共 _TOTAL_ 筆",
                    "infoEmpty": "顯示 0 筆",
                    "infoFiltered": "(從 _MAX_ 筆過濾)",
                    "search": "搜尋縣市：",
                    "paginate": { "first": "首", "previous": "前", "next": "後", "last": "末" }
                }
            });

            // 抓取氣象署氣象預報資料
            function fetchWeatherData() {
                const url = 'https://opendata.cwa.gov.tw/api/v1/rest/datastore/F-C0032-001?Authorization=CWA-DFFC9799-E66C-4E94-9AA9-A1E2DA21C4A1';

                fetch(url)
                    .then(response => {
                        if (!response.ok) throw new Error('網路連線異常');
                        return response.json();
                    })
                    .then(data => {
                        // 檢查結構是否包含 dataset 與 location
                        let locations = (data.records && data.records.location) ? data.records.location : [];
                        let tableRows = [];

                        locations.forEach(loc => {
                            let cityName = loc.locationName || 'N/A';
                            let weatherElements = loc.weatherElement || [];

                            // 初始化各欄位變數
                            let wx = '-', pop = '-', minT = '-', maxT = '-', ci = '-';

                            // 氣象署 F-C0032-001 包含了多個 weatherElement (Wx: 天氣現象, PoP: 降雨機率, MinT: 最低溫, MaxT: 最高溫, CI: 舒適度)
                            weatherElements.forEach(el => {
                                let firstTimeData = (el.time && el.time.length > 0) ? el.time[0].parameter : {};
                                
                                if (el.elementName === 'Wx') {
                                    wx = firstTimeData.parameterName || '-';
                                } else if (el.elementName === 'PoP') {
                                    let popVal = firstTimeData.parameterName || '0';
                                    pop = `<span class="badge-rain">${popVal} %</span>`;
                                } else if (el.elementName === 'MinT') {
                                    let minVal = firstTimeData.parameterName || '-';
                                    minT = `<span class="badge-temp">${minVal} °C</span>`;
                                } else if (el.elementName === 'MaxT') {
                                    let maxVal = firstTimeData.parameterName || '-';
                                    maxT = `<span class="badge-temp">${maxVal} °C</span>`;
                                } else if (el.elementName === 'CI') {
                                    ci = firstTimeData.parameterName || '-';
                                }
                            });

                            tableRows.push([
                                cityName,
                                wx,
                                pop,
                                minT,
                                maxT,
                                ci
                            ]);
                        });

                        // 更新 DataTables 資料
                        table.clear();
                        table.rows.add(tableRows);
                        table.draw(false);

                        $('#lastUpdateTime').text(getFormattedTime());
                    })
                    .catch(error => {
                        console.error('API 抓取失敗:', error);
                        $('#lastUpdateTime').text('連線失敗，請檢查授權碼或網路');
                    });
            }

            // 頁面載入後立即執行
            fetchWeatherData();
        });
    </script>

</body>
</html>
