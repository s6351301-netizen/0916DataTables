<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Bank | API / JSON 作業</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/3.0.4/css/dataTables.dataTables.css">
    <style>
        body {
            background: #f4f7f9;
        }

        .hero {
            background: #183642;
            color: #fff;
        }

        .hero small {
            color: #a8d5cf;
        }

        .content-panel {
            margin-top: -2rem;
            position: relative;
        }

        .table-wrap {
            overflow-x: auto;
        }

        #wordTable tbody tr {
            cursor: pointer;
        }

        #wordTable tbody tr:hover {
            background: #e8f4f2;
        }

        .meaning {
            color: #087f73;
            font-weight: 600;
        }

        #statusMessage {
            min-height: 24px;
        }
    </style>
</head>

<body>
    <header class="hero py-5">
        <div class="container">
            <small class="text-uppercase fw-bold">API / JSON Practice</small>
            <h1 class="display-6 fw-bold mt-2">Word Bank</h1>
            <p class="lead mb-0">從資料來源載入單字，使用表格完成搜尋、排序與瀏覽。</p>
        </div>
    </header>

    <main class="container content-panel pb-5">
        <section class="card border-0 shadow-sm p-3 p-md-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <div>
                    <h2 class="h4 mb-1">單字清單</h2>
                    <p class="text-secondary mb-0">點選任一列查看完整例句與中文翻譯。</p>
                </div>
                <button id="reloadButton" class="btn btn-success" type="button">重新載入資料</button>
            </div>

            <form id="dictionaryForm" class="row g-2 mb-3">
                <div class="col-sm-8 col-md-9">
                    <label class="visually-hidden" for="dictionaryWord">輸入英文單字</label>
                    <input id="dictionaryWord" class="form-control" type="search" placeholder="API串不好，這裡失效中" required>
                </div>
                <div class="col-sm-4 col-md-3 d-grid">
                    <button class="btn btn-outline-success" type="submit">查詢字典 API</button>
                </div>
            </form>
            <div id="dictionaryResult" class="alert alert-light border d-none mb-3"></div>

            <div id="statusMessage" class="small text-secondary mb-2" role="status" aria-live="polite"></div>

            <div class="table-wrap">
                <table id="wordTable" class="display table table-striped align-middle w-100">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Word</th>
                            <th>Meaning</th>
                            <th>Pronunciation</th>
                            <th>Sentence</th>
                            <th>Sentence meaning</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>

    <div class="modal fade" id="wordModal" tabindex="-1" aria-labelledby="wordModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="wordModalLabel" class="modal-title h5"></h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
                </div>
                <div class="modal-body">
                    <p id="modalMeaning" class="meaning fs-5"></p>
                    <p id="modalPronunciation" class="text-secondary"></p>
                    <hr>
                    <p id="modalSentence" class="mb-2"></p>
                    <p id="modalSentenceMeaning" class="text-secondary mb-0"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/3.0.4/js/dataTables.js"></script>
    <script>
        $(function () {
            const dataUrl = './data.json';
            const dictionaryApiUrl = 'https://api.dictionaryapi.dev/api/v2/entries/en/';
            let wordTable;
            let localWords = [];

            function setStatus(message, isError = false) {
                $('#statusMessage')
                    .text(message)
                    .toggleClass('text-danger', isError)
                    .toggleClass('text-secondary', !isError);
            }

            function showWord(word) {
                $('#wordModalLabel').text(word.word);
                $('#modalMeaning').text(word.meaning);
                $('#modalPronunciation').text(word.pronunciation);
                $('#modalSentence').text(word.sentence);
                $('#modalSentenceMeaning').text(word.sentence_meaning);
                bootstrap.Modal.getOrCreateInstance('#wordModal').show();
            }

            function showLocalWord(word) {
                const result = $('#dictionaryResult');
                result.empty().append(
                    $('<h3>').addClass('h5').text(word.word),
                    $('<p>').addClass('text-secondary mb-2').text(word.pronunciation),
                    $('<p>').addClass('mb-2').append(
                        $('<strong>').text('中文意思：'),
                        document.createTextNode(word.meaning)
                    ),
                    $('<p>').addClass('mb-1').text(word.sentence),
                    $('<p>').addClass('text-secondary mb-0').text(word.sentence_meaning),
                    $('<small>').addClass('d-block text-muted mt-3').text('目前顯示本地 JSON 備援資料')
                );
            }

            function lookupDictionary(word) {
                const result = $('#dictionaryResult');
                result.removeClass('d-none alert-danger').addClass('alert-light').text('正在查詢字典 API...');

                $.ajax({
                    url: dictionaryApiUrl + encodeURIComponent(word),
                    method: 'GET',
                    dataType: 'json',
                    timeout: 5000
                }).done(function (entries) {
                    const entry = entries[0];
                    const phonetic = entry.phonetic || (entry.phonetics.find(function (item) {
                        return item.text;
                    }) || {}).text || '查無音標';
                    const definitions = [];

                    entry.meanings.forEach(function (meaning) {
                        meaning.definitions.slice(0, 3).forEach(function (definition) {
                            definitions.push({
                                partOfSpeech: meaning.partOfSpeech,
                                definition: definition.definition,
                                example: definition.example
                            });
                        });
                    });

                    result.empty().append(
                        $('<h3>').addClass('h5').text(entry.word),
                        $('<p>').addClass('text-secondary mb-2').text(phonetic)
                    );

                    definitions.forEach(function (item) {
                        const definition = $('<p>').addClass('mb-2').append(
                            $('<strong>').text('[' + item.partOfSpeech + '] '),
                            document.createTextNode(item.definition)
                        );
                        if (item.example) {
                            definition.append($('<br>'), $('<em>').text('例句：' + item.example));
                        }
                        result.append(definition);
                    });
                }).fail(function (xhr, status) {
                    const localWord = localWords.find(function (item) {
                        return item.word.toLowerCase() === word.toLowerCase();
                    });

                    if (localWord) {
                        result.removeClass('alert-danger').addClass('alert-light');
                        showLocalWord(localWord);
                        return;
                    }

                    const message = xhr.status === 404
                        ? '查不到這個單字，請確認拼字後再試一次。'
                        : status === 'timeout'
                            ? '字典 API 連線逾時，請稍後再試。'
                            : '字典 API 目前無法連線，請稍後再試。';
                    result.removeClass('alert-light').addClass('alert-danger').text(message);
                });
            }

            function loadWords() {
                setStatus('正在載入資料...');

                $.ajax({
                    url: dataUrl,
                    method: 'GET',
                    dataType: 'json'
                }).done(function (words) {
                    localWords = words;
                    if (wordTable) {
                        wordTable.destroy();
                    }

                    const rows = words.map(function (word) {
                        return [
                            word.id,
                            word.word,
                            '<span class="meaning">' + word.meaning + '</span>',
                            word.pronunciation,
                            word.sentence,
                            word.sentence_meaning
                        ];
                    });

                    wordTable = new DataTable('#wordTable', {
                        data: rows,
                        pageLength: 5,
                        language: {
                            search: '搜尋：',
                            lengthMenu: '每頁顯示 _MENU_ 筆',
                            info: '顯示第 _START_ 至 _END_ 筆，共 _TOTAL_ 筆',
                            infoEmpty: '沒有資料',
                            zeroRecords: '找不到符合的單字',
                            paginate: { previous: '上一頁', next: '下一頁' }
                        }
                    });

                    $('#wordTable tbody').off('click').on('click', 'tr', function () {
                        const row = wordTable.row(this).data();
                        if (row) {
                            showWord(words.find(function (word) {
                                return String(word.id) === String(row[0]);
                            }));
                        }
                    });

                    setStatus('已載入 ' + words.length + ' 筆資料，資料來源：' + dataUrl);
                }).fail(function () {
                    setStatus('資料載入失敗，請確認路徑正確，並使用 Live Server 開啟此頁面。', true);
                });
            }

            $('#reloadButton').on('click', loadWords);
            $('#dictionaryForm').on('submit', function (event) {
                event.preventDefault();
                lookupDictionary($('#dictionaryWord').val().trim());
            });
            loadWords();
        });
    </script>
</body>

</html>
