<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataTables - YouBike 2.0 萬華區預設與每3分鐘自動更新</title>
    
    <!-- 1. 引入 DataTables CSS 樣式表 -->
    <link rel="stylesheet" href="url?id=121.13.6/css/jquery.dataTables.min.css">
    
    <style>
        body { font-family: "Microsoft JhengHei", Arial, sans-serif; background-color: #f8f9fa; }
        .container { width: 90%; max-width: 1200px; margin: 30px auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header-box { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; margin-bottom: 15px; }
        h2 { color: #2c3e50; margin: 0 0 5px 0; }
        p.subtitle { color: #7f8c8d; margin: 0; }
        .update-info { background: #e2e3e5; padding: 8px 12px; border-radius: 4px; font-size: 13px; color: #383d41; font-weight: bold; }
        .filter-section { background: #e9ecef; padding: 15px; border-radius: 6px; margin-bottom: 20px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
        .filter-group { display: flex; align-items: center; gap: 8px; }
        .filter-group label { font-weight: bold; color: #495057; }
        .filter-group select { padding: 6px 12px; border: 1px solid #ced4da; border-radius: 4px; font-size: 14px; background: #fff; }
        .badge-available { background-color: #d4edda; color: #155724; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .badge-empty { background-color: #f8d7da; color: #721c24; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-box">
            <div>
                <h2>🚲 YouBike 2.0 車位查詢（預設萬華區）</h2>
                <p class="subtitle">資料來源：台北市開放資料平臺 (每 3 分鐘自動更新)</p>
            </div>
            <!-- 顯示最後更新時間 -->
            <div class="update-info">
                最後更新時間：<span id="lastUpdateTime">載入中...</span>
            </div>
        </div>
        
        <!-- 雙層下拉式關聯選單介面 -->
        <div class="filter-section">
            <div class="filter-group">
                <label for="citySelect">選擇縣市：</label>
                <select id="citySelect">
                    <option value="Taipei">台北市</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label for="districtSelect">選擇行政區：</label>
                <select id="districtSelect">
                    <option value="">全部行政區</option>
                </select>
            </div>
        </div>

        <!-- 2. 建立 DataTables 表格 -->
        <table id="youbikeTable" class="display" style="width:100%">
            <thead>
                <tr>
                    <th>場站區域</th>
                    <th>站點名稱 (中文)</th>
                    <th>地址</th>
                    <th>可借車數</th>
                    <th>可還空位</th>
                    <th>總停車柱</th>
                    <th>資料更新時間</th>
                </tr>
            </thead>
            <tbody>
                <!-- 透過 Ajax 自動填入 -->
            </tbody>
        </table>
    </div>

    <!-- 3. 引入 jQuery 與 DataTables JS -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <!-- 4. 初始化 DataTables、自動更新與關聯選單邏輯 -->
    <script>
        $(document).ready(function() {
            let table;
            let rawData = [];
            let isInitialLoaded = false; // 用於判斷是否為首次載入

            // 格式化目前時間為字串 (YYYY-MM-DD HH:mm:ss)
            function getFormattedTime() {
                let now = new Date();
                let year = now.getFullYear();
                let month = String(now.getMonth() + 1).padStart(2, '0');
                let day = String(now.getDate()).padStart(2, '0');
                let hours = String(now.getHours()).padStart(2, '0');
                let minutes = String(now.getMinutes()).padStart(2, '0');
                let seconds = String(now.getSeconds()).padStart(2, '0');
                return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
            }

            // 初始化 DataTables
            table = $('#youbikeTable').DataTable({
                ajax: {
                    url: 'https://tcgbusfs.blob.core.windows.net/dotapp/youbike/v2/youbike_immediate.json',
                    dataSrc: function(json) {
                        rawData = json; 
                        updateDistrictOptions(rawData);
                        $('#lastUpdateTime').text(getFormattedTime());

                        // 首次載入時預設選擇萬華區並過濾表格
                        if (!isInitialLoaded) {
                            isInitialLoaded = true;
                            $('#districtSelect').val('萬華區');
                            // 套用萬華區精準過濾
                            table.column(0).search('^萬華區$', true, false).draw();
                        }
                        return json;
                    }
                },
                columns: [
                    { data: 'sarea' },
                    { data: 'sna' },
                    { data: 'ar' },
                    { 
                        data: 'available_rent_bikes',
                        render: function(data) {
                            return `<span class="badge-available">${data} 台</span>`;
                        }
                    },
                    { 
                        data: 'available_return_bikes',
                        render: function(data) {
                            let badgeClass = data == 0 ? 'badge-empty' : 'badge-available';
                            return `<span class="${badgeClass}">${data} 格</span>`;
                        }
                    },
                    { data: 'total' },     // 修正處：將原本的 tot 改回正確的 total
                    { data: 'updateTime' }
                ],
                pageLength: 25,
                language: {
                    "lengthMenu": "每頁顯示 _MENU_ 筆站點",
                    "zeroRecords": "找不到符合的 YouBike 站點",
                    "info": "顯示第 _START_ 至 _END_ 筆，共 _TOTAL_ 筆站點",
                    "infoEmpty": "顯示第 0 至 0 筆資料",
                    "infoFiltered": "(從 _MAX_ 筆資料中過濾)",
                    "search": "關鍵字搜尋：",
                    "paginate": {
                        "first": "首頁",
                        "previous": "上一頁",
                        "next": "下一頁",
                        "last": "末頁"
                    }
                }
            });

            // 設定每 3 分鐘（180,000 毫秒）自動重新向 API 請求資料並更新表格
            setInterval(function() {
                table.ajax.reload(null, false); 
            }, 180000);

            // 動態產生行政區選項
            function updateDistrictOptions(data) {
                let currentVal = $('#districtSelect').val();
                const districts = [...new Set(data.map(item => item.sarea))].sort();
                let options = '<option value="">全部行政區</option>';
                districts.forEach(district => {
                    let selected = (district === currentVal) ? 'selected' : '';
                    options += `<option value="${district}" ${selected}>${district}</option>`;
                });
                $('#districtSelect').html(options);
            }

            // 下拉選單連動事件
            $('#citySelect').on('change', function() {
                updateDistrictOptions(rawData);
                $('#districtSelect').val('');
                table.column(0).search('').draw();
            });

            $('#districtSelect').on('change', function() {
                let selectedDistrict = $(this).val();
                table.column(0).search(selectedDistrict ? '^' + selectedDistrict + '$' : '', true, false).draw();
            });
        });
    </script>

</body>
</html>
